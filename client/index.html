    <!--

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Kuwezaa",
      "url": "https://kuwezaa.cd/",
      "logo": "https://kuwezaa.cd/icon-512.png",
      "description": "Kuwezaa relie les agriculteurs congolais aux vendeurs qualifiés grâce à une ligne de crédit simple, pour un marché plus stable et des récoltes mieux vendues.",
      "areaServed": { "@type": "Country", "name": "République Démocratique du Congo" },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "email": "contact@kuwezaa.cd",
        "availableLanguage": ["French", "English", "Swahili"]
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Kuwezaa",
      "url": "https://kuwezaa.cd/",
      "inLanguage": ["fr", "en", "sw"],
      "description": "Plateforme numérique qui connecte les agriculteurs et les vendeurs de produits agricoles en République Démocratique du Congo."
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "name": "Ligne de crédit Kuwezaa",
      "serviceType": "Ligne de crédit pour vendeurs de produits agricoles",
      "provider": { "@type": "Organization", "name": "Kuwezaa", "url": "https://kuwezaa.cd/" },
      "areaServed": { "@type": "Country", "name": "République Démocratique du Congo" },
      "audience": {
        "@type": "BusinessAudience",
        "audienceType": "Vendeurs et commerçants de produits agricoles"
      },
      "description": "La ligne de crédit Kuwezaa permet aux vendeurs qualifiés d'acheter chez les agriculteurs sans payer tout d'avance. Conditions fixées à l'avance, sans frais cachés, remboursement après la vente des produits."
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Est-ce que c'est un prêt usurier ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Non. La ligne de crédit Kuwezaa n'est pas un prêt à taux abusif. Les conditions sont fixées à l'avance, expliquées clairement avant que vous acceptiez, et ne changent pas en cours de route."
          }
        },
        {
          "@type": "Question",
          "name": "Que se passe-t-il si je ne peux pas rembourser à temps ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Contactez-nous dès que possible. Nous travaillons avec chaque vendeur pour trouver un arrangement raisonnable plutôt que d'appliquer des pénalités automatiques."
          }
        },
        {
          "@type": "Question",
          "name": "Mes données sont-elles en sécurité ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui. Vos informations personnelles et professionnelles ne sont utilisées que pour évaluer votre inscription et gérer votre ligne de crédit. Elles ne sont jamais revendues à des tiers."
          }
        },
        {
          "@type": "Question",
          "name": "Combien coûte l'inscription sur Kuwezaa ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "L'inscription est entièrement gratuite, pour les agriculteurs comme pour les vendeurs."
          }
        },
        {
          "@type": "Question",
          "name": "Je suis agriculteur, dois-je aussi rembourser un crédit ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Non. La ligne de crédit concerne uniquement les vendeurs. En tant qu'agriculteur, vous êtes payé directement pour ce que vous vendez."
          }
        },
        {
          "@type": "Question",
          "name": "Comment suis-je payé en tant qu'agriculteur ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Vous convenez du prix et de la quantité avec le vendeur, puis recevez votre paiement par mobile money ou en espèces à la livraison."
          }
        },
        {
          "@type": "Question",
          "name": "Kuwezaa est-il disponible dans ma province ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Kuwezaa est actif à Kinshasa, au Kongo Central et dans le Kwilu, et s'étend progressivement aux autres provinces de la RDC. Si votre province n'est pas encore active, inscrivez-vous quand même : nous vous préviendrons dès l'ouverture."
          }
        }
      ]
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HowTo",
      "name": "Comment rejoindre Kuwezaa en tant qu'agriculteur",
      "description": "Les quatre étapes pour un agriculteur qui rejoint Kuwezaa et vend ses produits à des vendeurs qualifiés.",
      "step": [
        {
          "@type": "HowToStep",
          "name": "Inscrivez votre exploitation",
          "text": "Indiquez vos cultures, votre récolte moyenne et votre région en quelques minutes."
        },
        {
          "@type": "HowToStep",
          "name": "Soyez visible auprès des vendeurs",
          "text": "Les vendeurs de votre zone voient vos produits disponibles et vous contactent directement."
        },
        {
          "@type": "HowToStep",
          "name": "Vendez à un prix convenu",
          "text": "Vous fixez la quantité et le prix avec le vendeur, sans intermédiaire caché."
        },
        {
          "@type": "HowToStep",
          "name": "Recevez votre paiement",
          "text": "Le paiement est confirmé dès la livraison, par mobile money ou en espèces selon votre préférence."
        }
      ]
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HowTo",
      "name": "Comment rejoindre Kuwezaa en tant que vendeur",
      "description": "Les quatre étapes pour un vendeur qui rejoint Kuwezaa, obtient une ligne de crédit et achète directement chez les agriculteurs.",
      "step": [
        {
          "@type": "HowToStep",
          "name": "Inscrivez votre activité",
          "text": "Présentez votre entreprise et votre volume d'achat habituel pour être évalué."
        },
        {
          "@type": "HowToStep",
          "name": "Obtenez votre ligne de crédit",
          "text": "Une fois qualifié, vous recevez une ligne de crédit pour acheter directement chez les agriculteurs."
        },
        {
          "@type": "HowToStep",
          "name": "Achetez chez les producteurs",
          "text": "Trouvez des agriculteurs près de chez vous et achetez au prix juste, sans avancer tout le cash."
        },
        {
          "@type": "HowToStep",
          "name": "Remboursez après la vente",
          "text": "Vous remboursez la ligne de crédit selon un calendrier clair, une fois vos produits vendus."
        }
      ]
    }
    </script>
